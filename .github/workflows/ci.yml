name: CI

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet test --no-build
      - name: Smoke test tool package
        shell: bash
        run: |
          dotnet pack src/McpTime.Host -c Release -o artifacts/package
          help_output=$(dotnet dnx Vompa.McpTime --source artifacts/package --yes -- --help)
          echo "$help_output" | grep -q -- '--local-timezone'
          if dotnet dnx Vompa.McpTime --source artifacts/package --yes -- --local-timezone Not/AZone; then
            echo "::error::invalid timezone was accepted"
            exit 1
          fi
